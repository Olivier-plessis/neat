name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write
  # Starts the CI workflow on the release branch (see "Run CI on the release branch").
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      # ── Gate: the release must be healthy before it even opens a PR ──
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # bump_version.sh strips the tag's +build suffix when naming the
      # release branch (see its own release_branch_name) — re-derive the
      # same name here, e.g. tag v1.3.11+20260722 -> releases/v1.3.11.
      - name: Resolve release branch
        id: release_branch
        run: echo "name=releases/${GITHUB_REF_NAME%%+*}" >> "$GITHUB_OUTPUT"

      # ── Integrate the tagged release into main and develop via a PR ──
      # main/develop require a pull request before merging (branch ruleset),
      # so this opens one instead of pushing directly, then turns on GitHub's
      # native auto-merge: each PR merges itself once its required checks
      # pass — same automated end result as the old direct push, just routed
      # through a PR. Requires "Allow auto-merge" enabled once in Settings ->
      # General -> Pull Requests. Idempotent: reuses an existing PR for the
      # same head/base pair instead of failing on a re-run.
      - name: Open + auto-merge PR into main
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.release_branch.outputs.name }}
        run: |
          pr_url=$(gh pr list --head "$HEAD_BRANCH" --base main --json url -q '.[0].url')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create --base main --head "$HEAD_BRANCH" \
              --title "ci: merge ${GITHUB_REF_NAME} into main" \
              --body "Automated release merge for ${GITHUB_REF_NAME}.")
          fi
          if ! out=$(gh pr merge "$pr_url" --auto --merge 2>&1); then
            echo "$out"
            case "$out" in
              # The base branch has no rule to wait for, so there is nothing to
              # auto-merge on: merge right away. Any other failure stays a failure.
              *"Protected branch rules not configured"*) gh pr merge "$pr_url" --merge ;;
              *) exit 1 ;;
            esac
          fi

      - name: Open + auto-merge PR into develop
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.release_branch.outputs.name }}
        run: |
          pr_url=$(gh pr list --head "$HEAD_BRANCH" --base develop --json url -q '.[0].url')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create --base develop --head "$HEAD_BRANCH" \
              --title "ci: merge ${GITHUB_REF_NAME} into develop" \
              --body "Automated release merge for ${GITHUB_REF_NAME}.")
          fi
          if ! out=$(gh pr merge "$pr_url" --auto --merge 2>&1); then
            echo "$out"
            case "$out" in
              # The base branch has no rule to wait for, so there is nothing to
              # auto-merge on: merge right away. Any other failure stays a failure.
              *"Protected branch rules not configured"*) gh pr merge "$pr_url" --merge ;;
              *) exit 1 ;;
            esac
          fi

      # ── Run the required check on the release PR ──
      # A pull request opened with the workflow's own token does not start the
      # CI workflow (GitHub does not trigger workflows from events caused by
      # GITHUB_TOKEN), so the `analyze-and-test` check that `main` requires
      # would never arrive and the PR into main would stay blocked for ever.
      # workflow_dispatch is the exception: start CI by hand on the release
      # branch, so the check is reported on the PR's head commit. The heavy
      # `generation` job is skipped (it already ran on develop).
      - name: Run CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.release_branch.outputs.name }}
        run: gh workflow run flutter.yml --ref "$HEAD_BRANCH" -f generation=false

      # ── Publish the GitHub Release ──
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"

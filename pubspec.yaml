name: neat
description: "A Flutter Clean Architecture project generator with a Workshop that adds features to existing projects."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

workspace:
  - packages/neat_ui
dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.3.1
  # Pulls screen_retriever_macos, which lacks Swift Package Manager support →
  # harmless "plugins do not support SPM" warning at startup (Flutter 3.44).
  # Disabling SPM does NOT silence it. Bump when screen_retriever ships SPM
  # support, then the warning disappears. Tracking: window_manager / screen_retriever.
  window_manager: ^0.5.1
  file_picker: ^11.0.2
  path_provider: ^2.1.4
  riverpod_lint: ^3.1.3
  logger: ^2.7.0
  package_info_plus: ^9.0.1
  riverpod_annotation: ^4.0.2
  chopper: ^8.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  material_color_utilities: ^0.13.0
  image: ^4.8.0
  url_launcher: ^6.3.2
  google_fonts: ^8.1.0
  # Used to render an accurate Live Preview for pasted FlexColorScheme code
  # (named-scheme case — see ThemeEngineState._parsedFlexScheme). Version
  # matches the catalog entry generated projects pull in (see PubPackage
  # 'flex_color_scheme' in main_layout.dart).
  flex_color_scheme: ^8.0.2
  neat_ui:
    path: packages/neat_ui


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.2
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  chopper_generator: ^8.6.2
  freezed: ^3.2.5
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
